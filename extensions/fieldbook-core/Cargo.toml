[package]
name = "fieldbook-core"
version = "0.1.0"
edition = "2021"
description = "Neutral, DB-agnostic core for the Fieldbook DuckDB extension: the in-database executable notebook. Owns the four mutate/record scalars (fieldbook_create, fieldbook_add_entry, fieldbook_drop, fieldbook_record_run) as a `declare!` capability table plus the CREATE TABLE / CREATE MACRO bootstrap SQL. Mirrors the native duckdb-fieldbook extension's surface; a per-DB shim (ducklink `duckdb:extension` in ../../ducklink/extensions/fieldbook-component) reaches through the `duckdb:extension/nested-exec` WIT import to run the SQL on a sibling connection."
license = "MIT"
repository = "https://github.com/tegmentum/datalink"

[lib]
name = "fieldbook_core"
path = "src/lib.rs"

[dependencies]
datalink-extcore = { path = "../../crates/datalink-extcore" }
