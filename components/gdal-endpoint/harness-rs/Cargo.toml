[package]
name = "gdal-endpoint-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace]

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "48.0.0", features = ["component-model"] }
wasmtime-wasi = "48.0.0"
anyhow = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
